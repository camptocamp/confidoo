name: pre-commit

on:
  pull_request:
    branches:
      - "master"
      - "main"
  push:
    branches:
      - "master"
      - "main"

jobs:
  pre-commit:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
      - name: Run prek / pre-commit
        run: uvx prek --show-diff-on-failure --all-files
