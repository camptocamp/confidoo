services:
  db:
    image: postgres:${POSTGRES_VERSION:-15}
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    ports:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 1s
      timeout: 1s
      retries: 30

  odoo:
    image: odoo:${ODOO_VERSION:-16.0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    command: odoo --database=odoo --db_host=db --db_user=odoo --db_password=odoo
    ports:
      - 8069
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/login || exit 1"]
      interval: 1s
      timeout: 1s
      retries: 30
